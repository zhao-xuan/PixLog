name: PixLog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: zhao-xuan/PixLog@main
        with:
          version: v0.1.0
          policy: .pixlog-policy.json
