name: PixLog

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: zhao-xuan/PixLog@v0.1.1
        with:
          version: v0.1.1
          policy: .pixlog-policy.json
